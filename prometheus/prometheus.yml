global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor_containers'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'nginx_webserver'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'mysql_database'
    static_configs:
      - targets: ['mysql-exporter:9104']
