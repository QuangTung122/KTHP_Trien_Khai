events {
    worker_connections 1024;
}

http {
    server_tokens off; # Hardening: Ẩn phiên bản Nginx

    # HTTP tự động chuyển hướng sang HTTPS
    server {
        listen 80;
        server_name localhost;

        # Endpoint nội bộ cho Nginx Prometheus Exporter
        location /nginx_status {
            stub_status on;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Reverse Proxy + Security Headers
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Hardening: Các Security Headers bắt buộc
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://inventory-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
